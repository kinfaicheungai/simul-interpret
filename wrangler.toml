# Cloudflare Workers config. Secrets (OPENAI_API_KEY, APP_PASSWORD) are set in the
# Cloudflare dashboard or with `npx wrangler secret put`, never in this file.
name = "simul-interpret"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Keep the public https://simul-interpret.<account>.workers.dev URL on.
workers_dev = true
preview_urls = false

# Request logs in the Cloudflare dashboard (Observability tab), for troubleshooting.
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker first so every response gets the security headers.
run_worker_first = true

# Users and login sessions. Created automatically on first deploy (no id needed).
[[kv_namespaces]]
binding = "USERS"

[vars]
MAX_SESSION_MINUTES = "30"
ALLOW_OWN_KEY = "false"
SESSIONS_PER_MINUTE = "6"
