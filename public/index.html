<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075b51">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Live Interpreter">
  <title>Live Interpreter</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="topbar">
        <p class="eyebrow">LIVE INTERPRETER</p>
        <label class="ui-lang"><span class="sr-only" data-i18n="uiLanguage"></span>
          <select id="ui-lang" aria-label="Interface language">
            <option value="zh-Hant">繁體中文</option>
            <option value="zh-Hans">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <h1 data-i18n="title"></h1>
      <p class="lead" data-i18n="lead"></p>
    </header>

    <details id="account" class="account">
      <summary><span data-i18n="account"></span> · <span id="account-state"></span></summary>
      <div class="account-body">
        <fieldset>
          <legend class="sr-only" data-i18n="account"></legend>
          <label class="choice" id="choice-own"><input type="radio" name="mode" value="own"> <span data-i18n="modeOwn"></span></label>
          <label class="choice" id="choice-owner"><input type="radio" name="mode" value="owner"> <span data-i18n="modeOwner"></span></label>
        </fieldset>
        <div id="own-fields">
          <label><span data-i18n="apiKey"></span>
            <input id="api-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-...">
          </label>
          <p class="hint" data-i18n="apiKeyHint"></p>
        </div>
        <div id="owner-fields">
          <label><span data-i18n="password"></span>
            <input id="password" type="password" autocomplete="current-password">
          </label>
        </div>
        <div class="controls">
          <button id="save-account" class="primary" data-i18n="save"></button>
          <button id="forget-account" data-i18n="forget"></button>
        </div>
        <p id="account-msg" class="hint" role="status"></p>
      </div>
    </details>

    <div class="settings">
      <label><span data-i18n="translateTo"></span>
        <select id="language"></select>
      </label>
      <label><span data-i18n="micDistance"></span>
        <select id="noise">
          <option value="near_field" data-i18n="near"></option>
          <option value="far_field" data-i18n="far"></option>
          <option value="off" data-i18n="noiseOff"></option>
        </select>
      </label>
    </div>

    <div class="controls">
      <button id="start" class="primary" data-i18n="start"></button>
      <button id="stop" disabled data-i18n="stop"></button>
      <button id="sound" aria-pressed="false" disabled data-i18n="playVoice"></button>
    </div>
    <p class="statusline"><span id="status" role="status"></span> <span id="clock"></span></p>
    <audio id="audio" autoplay playsinline muted></audio>

    <section>
      <div class="section-head">
        <h2 id="target-title" data-i18n="translation"></h2>
        <div class="tools">
          <button id="smaller" aria-label="A−">A−</button>
          <button id="bigger" aria-label="A+">A+</button>
        </div>
      </div>
      <div class="transcript" id="target" tabindex="0" aria-labelledby="target-title"></div>
    </section>
    <section>
      <h2 id="source-title" data-i18n="original"></h2>
      <div class="transcript" id="source" tabindex="0" aria-labelledby="source-title"></div>
    </section>

    <div class="controls">
      <button id="download" disabled data-i18n="download"></button>
      <button id="clear" disabled data-i18n="clear"></button>
    </div>

    <p class="note" data-i18n="note"></p>
    <p class="version" id="version"></p>
  </main>
</body>
</html>
