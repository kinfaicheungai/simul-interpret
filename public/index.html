<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075b51">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="即時傳譯">
  <title>即時傳譯</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">LIVE INTERPRETER · 測試版</p>
      <h1>即時傳譯</h1>
      <p class="lead">按開始後講嘢，網頁會持續收音，逐段顯示原文同譯文。請保持畫面喺前景。</p>
    </header>

    <div class="settings">
      <label>譯成
        <select id="language"></select>
      </label>
      <label>咪高峰距離
        <select id="noise">
          <option value="near_field">近距離（講者拎住電話）</option>
          <option value="far_field">遠距離（電話擺喺枱面）</option>
          <option value="off">關閉降噪</option>
        </select>
      </label>
    </div>

    <div class="controls">
      <button id="start" class="primary">開始收音</button>
      <button id="stop" disabled>停止</button>
      <button id="sound" aria-pressed="false" disabled>播放譯音</button>
    </div>
    <p class="statusline"><span id="status" role="status">等候開始</span> <span id="clock" aria-label="已用時間"></span></p>
    <audio id="audio" autoplay playsinline muted></audio>

    <section>
      <div class="section-head">
        <h2 id="target-title">譯文</h2>
        <div class="tools">
          <button id="smaller" aria-label="縮細字">A−</button>
          <button id="bigger" aria-label="放大字">A+</button>
        </div>
      </div>
      <div class="transcript" id="target" tabindex="0" aria-labelledby="target-title" aria-live="off"></div>
    </section>
    <section>
      <h2 id="source-title">原文</h2>
      <div class="transcript" id="source" tabindex="0" aria-labelledby="source-title"></div>
    </section>

    <div class="controls">
      <button id="download" disabled>下載字幕 (.txt)</button>
      <button id="clear" disabled>清除字幕</button>
    </div>

    <p class="note">收音期間，聲音會傳送到 OpenAI 處理。播放譯音時請戴耳機，減少回音。每次最長 <span id="max-min">10</span> 分鐘；網站唔會儲存錄音或字幕。</p>
  </main>
</body>
</html>
