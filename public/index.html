<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075b51">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Live Interpreter">
  <title>Live Interpreter</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="topbar">
        <p class="eyebrow">LIVE INTERPRETER</p>
        <label class="ui-lang"><span class="sr-only" data-i18n="uiLanguage"></span>
          <select id="ui-lang" aria-label="Interface language">
            <option value="zh-Hant">繁體中文</option>
            <option value="zh-Hans">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <h1 data-i18n="title"></h1>
      <p class="lead" data-i18n="lead"></p>
    </header>

    <details id="account" class="account">
      <summary><span data-i18n="account"></span> · <span id="account-state"></span></summary>
      <div class="account-body">
        <form id="login-form" class="account-body" autocomplete="on">
          <label><span data-i18n="username"></span>
            <input id="username" autocomplete="username" autocapitalize="off" spellcheck="false">
          </label>
          <label><span data-i18n="password"></span>
            <input id="password" type="password" autocomplete="current-password">
          </label>
          <div id="key-field" hidden>
            <label><span data-i18n="apiKey"></span>
              <input id="api-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-...">
            </label>
            <p class="hint" data-i18n="apiKeyHint"></p>
            <button type="button" class="help-link" data-help data-i18n="keyHelpButton"></button>
          </div>
          <div class="controls">
            <button id="login" type="submit" class="primary" data-i18n="login"></button>
          </div>
          <button type="button" class="help-link" data-help data-i18n="firstTimeHelp"></button>
        </form>
        <div id="logged-in" hidden>
          <div class="controls">
            <button id="logout" type="button" data-i18n="logout"></button>
            <button id="show-change-key" type="button" data-i18n="changeKey" hidden></button>
            <button id="show-change-password" type="button" data-i18n="changePassword" hidden></button>
          </div>
          <form id="password-form" class="account-body" hidden>
            <input type="text" id="pw-username" autocomplete="username" hidden>
            <label><span data-i18n="currentPassword"></span>
              <input id="current-password" type="password" autocomplete="current-password">
            </label>
            <label><span data-i18n="newPassword"></span>
              <input id="new-password-1" type="password" autocomplete="new-password">
            </label>
            <label><span data-i18n="confirmPassword"></span>
              <input id="new-password-2" type="password" autocomplete="new-password">
            </label>
            <p class="hint" data-i18n="passwordRule"></p>
            <div class="controls">
              <button type="submit" class="primary" data-i18n="savePassword"></button>
              <button id="cancel-password" type="button" data-i18n="cancel"></button>
            </div>
          </form>
        </div>
        <details id="own-key-box" hidden>
          <summary data-i18n="noAccount"></summary>
          <label><span data-i18n="apiKey"></span>
            <input id="own-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-...">
          </label>
          <button id="save-own-key" type="button" data-i18n="useThisKey"></button>
          <button type="button" class="help-link" data-help data-i18n="keyHelpButton"></button>
        </details>
        <p id="account-msg" class="hint" role="status"></p>
      </div>
    </details>

    <details id="admin" class="account" hidden>
      <summary data-i18n="manageUsers"></summary>
      <div class="account-body">
        <form id="new-user-form" class="row">
          <input id="new-username" autocapitalize="off" spellcheck="false" aria-label="username" data-i18n-placeholder="newUserPlaceholder">
          <button type="submit" class="primary" data-i18n="addUser"></button>
        </form>
        <div id="new-password" class="credentials" hidden></div>
        <ul id="user-list" class="user-list"></ul>
        <p id="admin-msg" class="hint" role="status"></p>
      </div>
    </details>

    <div class="settings">
      <label><span data-i18n="translateTo"></span>
        <select id="language"></select>
      </label>
      <label><span data-i18n="micDistance"></span>
        <select id="noise">
          <option value="near_field" data-i18n="near"></option>
          <option value="far_field" data-i18n="far"></option>
          <option value="off" data-i18n="noiseOff"></option>
        </select>
      </label>
    </div>

    <div class="controls">
      <button id="start" class="primary" data-i18n="start"></button>
      <button id="stop" disabled data-i18n="stop"></button>
      <button id="sound" aria-pressed="false" disabled data-i18n="playVoice"></button>
    </div>
    <p class="statusline"><span id="status" role="status"></span> <span id="clock"></span></p>
    <audio id="audio" autoplay playsinline muted></audio>

    <section>
      <div class="section-head">
        <h2 id="target-title" data-i18n="translation"></h2>
        <div class="tools">
          <button id="smaller" aria-label="A−">A−</button>
          <button id="bigger" aria-label="A+">A+</button>
        </div>
      </div>
      <div class="transcript" id="target" tabindex="0" aria-labelledby="target-title"></div>
    </section>
    <section>
      <h2 id="source-title" data-i18n="original"></h2>
      <div class="transcript" id="source" tabindex="0" aria-labelledby="source-title"></div>
    </section>

    <div class="controls">
      <button id="download" disabled data-i18n="download"></button>
      <button id="clear" disabled data-i18n="clear"></button>
    </div>

    <p class="note" data-i18n="note"></p>
    <p class="version" id="version"></p>
  </main>

  <dialog id="key-help" aria-labelledby="key-help-title">
    <div class="dialog-body">
      <h2 id="key-help-title" data-i18n="helpTitle"></h2>
      <p data-i18n="helpIntro"></p>
      <ol id="help-steps"></ol>
      <h3 data-i18n="helpTipsTitle"></h3>
      <ul id="help-tips"></ul>
      <form method="dialog"><button class="primary" data-i18n="helpClose"></button></form>
    </div>
  </dialog>
</body>
</html>
